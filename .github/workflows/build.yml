name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure release signing
        run: |
          BUILD_GRADLE=android/app/build.gradle
          KS_PATH="$HOME/trainlog-release.keystore"

          python3 - "$BUILD_GRADLE" <<'PY'
          import re, sys
          path = sys.argv[1]
          src = open(path).read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KEYSTORE_PATH'))
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
          '''

          if 'signingConfigs' not in src:
              src = src.replace('android {', 'android {' + signing_block, 1)

          release_block = '''
              release {
                  minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.release
              }
          '''
          pattern = r'buildTypes\s*\{\s*release\s*\{[^}]*\}\s*\}'
          if re.search(pattern, src):
              src = re.sub(pattern, 'buildTypes {\n' + release_block + '\n    }', src, count=1)

          open(path, 'w').write(src)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > "$GITHUB_WORKSPACE/trainlog-release.keystore"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/trainlog-release.keystore" >> $GITHUB_ENV

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Collect signed APK
        run: |
          mkdir -p dist-apk
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found"; exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" dist-apk/trainlog.apk

      - name: Verify APK signature
        run: |
          if "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner" verify --print-certs dist-apk/trainlog.apk; then
            echo "APK is signed correctly"
          else
            echo "ERROR: APK is NOT signed"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trainlog-apk
          path: dist-apk/trainlog.apk
          retention-days: 30
